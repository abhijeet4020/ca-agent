[project]
name = "ca-agent"
version = "0.1.0"
description = "Financial Agentic application - Silver layer data pipeline"
requires-python = ">=3.10.9,<3.11"

# Dependency notes (Thinking Craftsman: every dependency must be justified).
#   pydantic                   - validates config AND emits the canonical JSON used for the
#       reuse fingerprint (SPEC-01 req 8). One artifact serves both, so no separate schema.
#       pydantic-settings is deliberately NOT used: explicit layering of TOML then env is
#       easier to test and avoids source-precedence surprises.
#   tomli                      - Python 3.10 has no stdlib tomllib.
#   pyarrow                    - Parquet writer. pandas is deliberately NOT used on the read
#       path: it coerces "0012345" to 12345, destroying PAN/GSTIN/account identifiers.
#   openpyxl / xlrd / pyxlsb   - xlsx+xlsm / legacy xls / xlsb. None execute macros.
#   (no magic library)         - signature detection is a hand-written table in
#       readers/detection.py. The ~15 formats that actually need precise identification have
#       unambiguous magic numbers, and everything else routes to NO_COMPATIBLE_READER either
#       way, so puremagic/python-magic would add a dependency without changing any decision.
#   olefile / msoffcrypto-tool - OLE stream probing and encryption DETECTION only. No password
#       is ever supplied, requested or guessed (SPEC-01 req 5).
#   charset-normalizer         - encoding detection for csv/txt/eml.
#   pypdf / pdfplumber         - PDF structure+encryption / native text with layout.
#   pypdfium2                  - page rasterisation. PyMuPDF is rejected: AGPL-3.0.
#   python-docx/striprtf/lxml  - docx / rtf / html+xml.
#   pillow                     - image probing and preprocessing before the vision API.
#   py7zr                      - 7z archives.
#   httpx                      - vision transport. Chosen over the openai SDK because
#       httpx.MockTransport makes retry/backoff deterministically testable with zero network.
#   langchain-text-splitters   - chunking. langchain is already an approved stack component.
#   tqdm                       - operator progress over 16,596 files.
dependencies = [
    "pydantic>=2.7,<3",
    "tomli>=2.0,<3",
    "pyarrow>=16,<19",
    "openpyxl>=3.1,<4",
    "xlrd>=2.0,<3",
    "pyxlsb>=1.0,<2",
    "olefile>=0.47,<1",
    "msoffcrypto-tool>=5.4,<6",
    "charset-normalizer>=3.3,<4",
    "pypdf>=4.2,<6",
    "pdfplumber>=0.11,<1",
    "pypdfium2>=4.30,<5",
    "python-docx>=1.1,<2",
    "striprtf>=0.0.26,<0.1",
    "lxml>=5.2,<6",
    "pillow>=10.3,<12",
    "py7zr>=0.21,<1",
    "httpx>=0.27,<1",
    "langchain-text-splitters>=0.2,<1",
    "tqdm>=4.66,<5",
]

# Optional: rarfile shells out to an external unrar binary. Without it the 24 .rar files
# are recorded as NO_COMPATIBLE_READER rather than silently skipped.
[project.optional-dependencies]
rar = ["rarfile>=4.2,<5"]
# Gold layer (SPEC-01 req 2, Phase 2): local embeddings and per-scope FAISS indexes.
# Optional because sentence-transformers pulls in torch (~2.5 GB) and nothing in the Silver
# layer needs it; the embedder is injected, so the whole test suite runs without it.
gold = ["faiss-cpu>=1.8,<2", "numpy>=1.26,<3", "sentence-transformers>=3.0,<6"]

[project.scripts]
ca-agent = "ca_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2,<9",
    "pytest-cov>=5,<7",
    "pytest-mock>=3.14,<4",
    # test-only: stdlib zipfile can READ AES zips but cannot CREATE them, and the locked-file
    # tests need to build encrypted fixtures rather than commit binaries.
    "pyzipper>=0.3.6,<1",
    "ruff>=0.5,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ca_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "integration: builds a full synthetic multi-client tree",
    "slow: takes more than a second",
    "allow_network: explicit opt-out from the network kill-switch",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RET", "PTH"]
# BLE001 (blind except) is caught by our own review; E501 is handled by the formatter.
ignore = ["E501"]
