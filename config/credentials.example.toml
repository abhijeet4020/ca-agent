# Optional client document credentials (ADR-008 amendment).
#
# Copy to config/credentials.local.toml and point
# CAAGENT__CREDENTIALS__CLIENT_CREDENTIALS_PATH at it. The real file is gitignored: it holds
# client PANs and dates of birth and must never be committed.
#
# WHY THIS EXISTS
# 352 PDFs in the corpus are genuinely password-locked, and 213 of them are AIS and TIS
# filings - the richest income data the firm holds. The Income Tax portal protects those with
# a documented password: the PAN in lowercase followed by the date of birth as DDMMYYYY. The
# firm already holds both values for its own clients, so supplying them is not guessing.
#
# WHAT THE PIPELINE WILL AND WILL NOT DO
# It tries the empty password first, then only the candidates derived from what you write
# here. It never generates, permutes or brute-forces a password, and it never writes one into
# a processing record, a format document or a log line. A document that none of your
# credentials open stays recorded as PASSWORD_PROTECTED_FILE.
#
# The key is "<category>/<client>", matching the raw_data folder layout exactly. Category and
# client together are the key because two different clients can share a name across
# categories, and one client's credential must never be tried against another's documents.

# The names, PANs and dates below are invented. Never commit a real client's details: this
# file is version-controlled, and a PAN paired with a date of birth identifies a person.

[clients."Business Clients/EXAMPLE TRADING COMPANY"]
pan = "AAAAA0000A"
date_of_birth = "1980-01-01"

[clients."Salary Clients/EXAMPLE SALARIED CLIENT"]
pan = "BBBBB1111B"
date_of_birth = "1990-12-31"
# Bank statements use their own schemes, so literal passwords can be supplied as well.
extra_passwords = ["statement-password-if-any"]
